name: Semantic release

on:
  workflow_call:
    inputs:
      runs-on:
        description: JSON array of runner labels. Must stay on the self-hosted pool.
        type: string
        default: '["self-hosted", "linux", "small"]'
      working-directory:
        description: Directory holding the semantic-release config.
        type: string
        default: .
      node-version:
        type: string
        default: 24.17.0
      semantic-release-version:
        description: >-
          Used when the working directory's package.json does not list semantic-release.
          When it does, npm ci installs the caller's own pinned versions instead.
        type: string
        default: 25.0.9
      extra-plugins:
        description: >-
          Space-separated npm specs installed beside semantic-release when the caller has
          no package.json for it, such as "@semantic-release/exec@7.1.0".
        type: string
        default: ''
      pre-command:
        description: Shell run in the working directory before semantic-release.
        type: string
        default: ''
      dry-run:
        type: boolean
        default: false
      timeout-minutes:
        type: number
        default: 20
    secrets:
      RELEASE_TOKEN:
        description: >-
          Token used instead of GITHUB_TOKEN, for example to push a release commit past
          branch protection.
        required: false
    outputs:
      new-release-published:
        description: '"true" when a release was published.'
        value: ${{ jobs.release.outputs.new-release-published }}
      version:
        description: The released version without a prefix, such as 1.4.0.
        value: ${{ jobs.release.outputs.version }}
      tag:
        description: The git tag of the release, such as v1.4.0.
        value: ${{ jobs.release.outputs.tag }}

permissions:
  contents: read

jobs:
  release:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: write
    concurrency:
      group: semantic-release-${{ github.repository }}
      cancel-in-progress: false
    outputs:
      new-release-published: ${{ steps.release.outputs.new-release-published }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false

      - name: Install semantic-release
        id: install
        env:
          VERSION: ${{ inputs.semantic-release-version }}
          EXTRA_PLUGINS: ${{ inputs.extra-plugins }}
        run: |
          if [ -f package.json ] && grep -q '"semantic-release"' package.json; then
            npm ci --no-audit --no-fund
            echo "entry=$PWD/node_modules/semantic-release/index.js" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          prefix="$RUNNER_TEMP/semantic-release"
          mkdir -p "$prefix"
          # shellcheck disable=SC2086
          npm install --prefix "$prefix" --no-save --no-audit --no-fund "semantic-release@$VERSION" $EXTRA_PLUGINS
          echo "entry=$prefix/node_modules/semantic-release/index.js" >> "$GITHUB_OUTPUT"

      - name: Pre-command
        if: inputs.pre-command != ''
        env:
          COMMAND: ${{ inputs.pre-command }}
        run: eval "$COMMAND"

      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          SEMANTIC_RELEASE_ENTRY: ${{ steps.install.outputs.entry }}
          DRY_RUN: ${{ inputs.dry-run }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          node --input-type=module <<'EOF'
          import { appendFileSync } from "node:fs";
          import { pathToFileURL } from "node:url";

          const { default: semanticRelease } = await import(
            pathToFileURL(process.env.SEMANTIC_RELEASE_ENTRY).href
          );
          const dryRun = process.env.DRY_RUN === "true";
          const output = (key, value) =>
            appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`);

          const result = await semanticRelease({ dryRun });
          const next = result ? result.nextRelease : undefined;
          output("new-release-published", String(Boolean(next) && !dryRun));
          output("version", next ? next.version : "");
          output("tag", next ? next.gitTag : "");
          EOF

      - name: Summary
        env:
          PUBLISHED: ${{ steps.release.outputs.new-release-published }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if [ "$PUBLISHED" = true ]; then
            echo "Released $TAG" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No release published" >> "$GITHUB_STEP_SUMMARY"
          fi
